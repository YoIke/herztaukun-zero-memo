<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヘルトウクンØ - リモートメモツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .grid-cell { transition: all 0.15s ease; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-2 sm:p-4 select-none">

    <div class="max-w-md mx-auto bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-4 space-y-4">
        
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
            <h1 class="text-base font-bold tracking-wider text-orange-500 flex items-center gap-1">
                🤖 HERZTAUKUN Ø MEMO
            </h1>
            <button onclick="resetAll()" class="bg-red-700 hover:bg-red-600 text-[11px] px-2 py-1 rounded border border-red-500 transition font-bold">
                全リセット
            </button>
        </div>

        <div class="grid grid-cols-2 gap-3 bg-slate-850 p-2 rounded border border-slate-700 bg-slate-900/40">
            <div>
                <div class="text-[10px] font-bold text-slate-400 mb-1">敵施設アンテナ (目標: 3基以下)</div>
                <div class="space-y-1 text-xs">
                    <div class="flex items-center space-x-1.5">
                        <span class="w-4 font-bold text-red-400 text-center">A</span>
                        <button id="ant-a-1" onclick="toggleAntenna('a', 1)" class="w-6 h-6 bg-green-600 rounded border border-green-500 font-bold">📡</button>
                        <button id="ant-a-2" onclick="toggleAntenna('a', 2)" class="w-6 h-6 bg-green-600 rounded border border-green-500 font-bold">📡</button>
                        <button id="ant-a-3" onclick="toggleAntenna('a', 3)" class="w-6 h-6 bg-green-600 rounded border border-green-500 font-bold">📡</button>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <span class="w-4 font-bold text-yellow-400 text-center">B</span>
                        <button id="ant-b-1" onclick="toggleAntenna('b', 1)" class="w-6 h-6 bg-green-600 rounded border border-green-500 font-bold">📡</button>
                        <button id="ant-b-2" onclick="toggleAntenna('b', 2)" class="w-6 h-6 bg-green-600 rounded border border-green-500 font-bold">📡</button>
                        <button id="ant-b-3" onclick="toggleAntenna('b', 3)" class="w-6 h-6 bg-green-600 rounded border border-green-500 font-bold">📡</button>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <span class="w-4 font-bold text-blue-400 text-center">C</span>
                        <button id="ant-c-1" onclick="toggleAntenna('c', 1)" class="w-6 h-6 bg-green-600 rounded border border-green-500 font-bold">📡</button>
                        <button id="ant-c-2" onclick="toggleAntenna('c', 2)" class="w-6 h-6 bg-green-600 rounded border border-green-500 font-bold">📡</button>
                        <button id="ant-c-3" onclick="toggleAntenna('c', 3)" class="w-6 h-6 bg-green-600 rounded border border-green-500 font-bold">📡</button>
                    </div>
                </div>
                <div id="antenna-count" class="text-[11px] mt-1 text-emerald-400 font-bold">敵の残りアンテナ: 9基</div>
            </div>

            <div>
                <div class="text-[10px] font-bold text-slate-400 mb-1">妨害操作 (各方位1回)</div>
                <div class="grid grid-cols-2 gap-1 text-center">
                    <button id="jam-N" onclick="toggleJam('N')" class="bg-slate-700 hover:bg-slate-600 text-xs py-1.5 rounded border border-slate-600 font-bold">N (北)</button>
                    <button id="jam-E" onclick="toggleJam('E')" class="bg-slate-700 hover:bg-slate-600 text-xs py-1.5 rounded border border-slate-600 font-bold">E (東)</button>
                    <button id="jam-W" onclick="toggleJam('W')" class="bg-slate-700 hover:bg-slate-600 text-xs py-1.5 rounded border border-slate-600 font-bold">W (西)</button>
                    <button id="jam-S" onclick="toggleJam('S')" class="bg-slate-700 hover:bg-slate-600 text-xs py-1.5 rounded border border-slate-600 font-bold">S (南)</button>
                </div>
            </div>
        </div>

        <div>
            <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] font-bold text-slate-400">推理マップ (タップでメモ状態切替)</span>
                <button onclick="toggleMapVisibility()" id="btn-map-toggle" class="bg-slate-700 hover:bg-slate-600 text-[10px] px-2 py-0.5 rounded border border-slate-600 transition">
                    隠す
                </button>
            </div>
            <div id="map-area" class="transition duration-300">
                <div class="grid grid-cols-5 gap-1 bg-slate-950 p-2 rounded border border-slate-800 text-center text-sm font-bold">
                    <div class="text-slate-500 text-[10px] flex items-center justify-center font-normal">マーク</div>
                    <div class="text-slate-400 flex items-center justify-center">1</div>
                    <div class="text-slate-400 flex items-center justify-center">2</div>
                    <div class="text-slate-400 flex items-center justify-center">3</div>
                    <div class="text-slate-400 flex items-center justify-center">4</div>

                    <div class="text-green-500 text-lg flex items-center justify-center">♣</div>
                    <button id="cell-C-1" onclick="cycleCell('C', 1)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-C-2" onclick="cycleCell('C', 2)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-C-3" onclick="cycleCell('C', 3)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-C-4" onclick="cycleCell('C', 4)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>

                    <div class="text-red-400 text-lg flex items-center justify-center">♦</div>
                    <button id="cell-D-1" onclick="cycleCell('D', 1)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-D-2" onclick="cycleCell('D', 2)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-D-3" onclick="cycleCell('D', 3)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-D-4" onclick="cycleCell('D', 4)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>

                    <div class="text-red-500 text-lg flex items-center justify-center">♥</div>
                    <button id="cell-H-1" onclick="cycleCell('H', 1)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-H-2" onclick="cycleCell('H', 2)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-H-3" onclick="cycleCell('H', 3)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-H-4" onclick="cycleCell('H', 4)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>

                    <div class="text-indigo-400 text-lg flex items-center justify-center">♠</div>
                    <button id="cell-S-1" onclick="cycleCell('S', 1)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-S-2" onclick="cycleCell('S', 2)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-S-3" onclick="cycleCell('S', 3)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                    <button id="cell-S-4" onclick="cycleCell('S', 4)" class="grid-cell h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs"></button>
                </div>
                <div class="flex justify-between text-[10px] text-slate-400 px-1 mt-1 font-mono">
                    <span>[無印]未確定</span>
                    <span>[灰/×]安全</span>
                    <span>[黄/？]候補</span>
                    <span>[赤/！]確定</span>
                    <span>[青/👣]通過</span>
                </div>
            </div>
        </div>

        <div class="bg-slate-850 p-2 rounded border border-slate-700 bg-slate-900/40 space-y-1">
            <div class="flex justify-between items-center">
                <span class="text-[10px] font-bold text-slate-400">自分の基地座標 (相手に見せないよう管理)</span>
                <button onclick="togglePasswordVisibility()" id="btn-pw-toggle" class="bg-slate-700 hover:bg-slate-600 text-[10px] px-2 py-0.5 rounded border border-slate-600 transition">
                    表示する
                </button>
            </div>
            <div id="password-area" class="grid grid-cols-3 gap-2 blur-md pointer-events-none transition duration-300">
                <div>
                    <label class="text-[9px] text-slate-400 block text-center">基地A</label>
                    <input type="text" id="my-pw-a" placeholder="例: ♣2" class="w-full bg-slate-950 border border-slate-700 rounded text-xs p-1 text-center text-white font-bold">
                </div>
                <div>
                    <label class="text-[9px] text-slate-400 block text-center">基地B</label>
                    <input type="text" id="my-pw-b" placeholder="例: ♥4" class="w-full bg-slate-950 border border-slate-700 rounded text-xs p-1 text-center text-white font-bold">
                </div>
                <div>
                    <label class="text-[9px] text-slate-400 block text-center">基地C</label>
                    <input type="text" id="my-pw-c" placeholder="例: ♠1" class="w-full bg-slate-950 border border-slate-700 rounded text-xs p-1 text-center text-white font-bold">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="text-[10px] font-bold text-slate-400 block mb-1">敵パスワード予想</label>
                <div class="space-y-1">
                    <input type="text" id="enemy-try-1" placeholder="1st: A-B-C" class="w-full bg-slate-950 border border-slate-700 rounded p-1 text-xs text-white">
                    <input type="text" id="enemy-try-2" placeholder="2nd: A-B-C" class="w-full bg-slate-950 border border-slate-700 rounded p-1 text-xs text-white">
                </div>
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-400 block mb-1">自由メモ (思考ログ用)</label>
                <textarea id="free-memo" rows="2" placeholder="3T移動でヒット、等" class="w-full bg-slate-950 border border-slate-700 rounded text-xs p-1 h-[53px] text-white resize-none"></textarea>
            </div>
        </div>

    </div>

    <script>
        // セルのサイクル状態定義
        const STATES = [
            { text: '',   bg: 'bg-slate-800', border: 'border-slate-700', textCol: 'text-slate-100' },
            { text: '×',  bg: 'bg-slate-700', border: 'border-slate-600', textCol: 'text-slate-400' },
            { text: '？', bg: 'bg-yellow-600', border: 'border-yellow-500', textCol: 'text-slate-950' },
            { text: '！', bg: 'bg-red-600', border: 'border-red-500', textCol: 'text-white font-black' },
            { text: '👣', bg: 'bg-blue-600', border: 'border-blue-500', textCol: 'text-white' }
        ];
        
        const mapData = {};
        const marks = ['C', 'D', 'H', 'S']; // Clover, Diamond, Heart, Spade
        
        const antennaData = {
            a: [true, true, true],
            b: [true, true, true],
            c: [true, true, true]
        };

        const jammingData = { N: false, E: false, W: false, S: false };
        let passwordVisible = false;
        let mapVisible = true;

        // システム初期化
        function init() {
            marks.forEach(m => {
                for(let i=1; i<=4; i++) {
                    const key = `${m}-${i}`;
                    if (mapData[key] === undefined) mapData[key] = 0;
                    updateCellDOM(m, i);
                }
            });
            ['a','b','c'].forEach(f => {
                for(let i=1; i<=3; i++) updateAntennaDOM(f, i);
            });
            ['N','E','W','S'].forEach(d => updateJammingDOM(d));
            updateAntennaCount();
        }

        // マップセルのタップ時処理
        function cycleCell(mark, num) {
            const key = `${mark}-${num}`;
            mapData[key] = (mapData[key] + 1) % STATES.length;
            updateCellDOM(mark, num);
        }

        function updateCellDOM(mark, num) {
            const key = `${mark}-${num}`;
            const stateIdx = mapData[key];
            const state = STATES[stateIdx];
            const el = document.getElementById(`cell-${key}`);
            if(!el) return;
            
            el.className = `grid-cell h-10 rounded border flex items-center justify-center text-xs font-bold cursor-pointer ${state.bg} ${state.border} ${state.textCol}`;
            el.innerText = state.text;
        }

        // アンテナタップ時処理
        function toggleAntenna(facility, num) {
            antennaData[facility][num-1] = !antennaData[facility][num-1];
            updateAntennaDOM(facility, num);
            updateAntennaCount();
        }

        function updateAntennaDOM(facility, num) {
            const isAlive = antennaData[facility][num-1];
            const el = document.getElementById(`ant-${facility}-${num}`);
            if(!el) return;
            
            if(isAlive) {
                el.className = "w-6 h-6 bg-green-600 rounded border border-green-500 font-bold text-xs cursor-pointer";
                el.innerText = "📡";
            } else {
                el.className = "w-6 h-6 bg-slate-700 text-slate-500 rounded border border-slate-600 text-xs font-bold flex items-center justify-center cursor-pointer";
                el.innerText = "×";
            }
        }

        // 残りアンテナ計算と勝利通知
        function updateAntennaCount() {
            let count = 0;
            ['a','b','c'].forEach(f => {
                antennaData[f].forEach(alive => { if(alive) count++; });
            });
            
            const el = document.getElementById('antenna-count');
            if(count <= 3) {
                el.className = "text-[11px] mt-1 text-red-400 font-bold animate-pulse";
                el.innerText = `敵の残りアンテナ: ${count}基 (勝利条件達成！🚨)`;
            } else {
                el.className = "text-[11px] mt-1 text-emerald-400 font-bold";
                el.innerText = `敵の残りアンテナ: ${count}基`;
            }
        }

        // 妨害操作トグル
        function toggleJam(dir) {
            jammingData[dir] = !jammingData[dir];
            updateJammingDOM(dir);
        }

        function updateJammingDOM(dir) {
            const isUsed = jammingData[dir];
            const el = document.getElementById(`jam-${dir}`);
            if(!el) return;
            
            if(isUsed) {
                el.className = "bg-slate-800 text-slate-500 text-xs py-1.5 rounded border border-slate-700 line-through font-normal cursor-pointer";
            } else {
                el.className = "bg-slate-700 hover:bg-slate-600 text-xs py-1.5 rounded border border-slate-600 font-bold text-slate-100 cursor-pointer";
            }
        }

        // 推理マップ表示の切り替え
        function toggleMapVisibility() {
            mapVisible = !mapVisible;
            const area = document.getElementById('map-area');
            const btn = document.getElementById('btn-map-toggle');
            
            if(mapVisible) {
                area.classList.remove('blur-md', 'pointer-events-none');
                btn.innerText = "隠す";
                btn.classList.replace('bg-orange-700', 'bg-slate-700');
            } else {
                area.classList.add('blur-md', 'pointer-events-none');
                btn.innerText = "表示する";
                btn.classList.replace('bg-slate-700', 'bg-orange-700');
            }
        }

        // 自軍パスワード表示の切り替え
        function togglePasswordVisibility() {
            passwordVisible = !passwordVisible;
            const area = document.getElementById('password-area');
            const btn = document.getElementById('btn-pw-toggle');
            
            if(passwordVisible) {
                area.classList.remove('blur-md', 'pointer-events-none');
                btn.innerText = "隠す";
                btn.classList.replace('bg-slate-700', 'bg-orange-700');
            } else {
                area.classList.add('blur-md', 'pointer-events-none');
                btn.innerText = "表示する";
                btn.classList.replace('bg-orange-700', 'bg-slate-700');
            }
        }

        // オールリセット
        function resetAll() {
            if(!confirm("すべての記録を初期化して、新しいゲームを始めますか？")) return;
            
            marks.forEach(m => {
                for(let i=1; i<=4; i++) mapData[`${m}-${i}`] = 0;
            });
            ['a','b','c'].forEach(f => {
                antennaData[f] = [true, true, true];
            });
            ['N','E','W','S'].forEach(d => jammingData[d] = false);
            
            document.getElementById('my-pw-a').value = '';
            document.getElementById('my-pw-b').value = '';
            document.getElementById('my-pw-c').value = '';
            document.getElementById('enemy-try-1').value = '';
            document.getElementById('enemy-try-2').value = '';
            document.getElementById('free-memo').value = '';
            
            passwordVisible = true;
            togglePasswordVisibility();

            mapVisible = false;
            toggleMapVisibility();

            init();
        }

        // 起動処理
        init();
    </script>
</body>
</html>
